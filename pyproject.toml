[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Deep-research agent: plan, hybrid retrieval, cited synthesis and claim verification over your own documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
deep-research = "research.cli:main"
